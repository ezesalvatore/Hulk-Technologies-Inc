version: 1
frontend:
  phases:
    build:
      commands:
        # Generate config.js from environment variables set in the Amplify console.
        # These values are injected at build time and never stored in source control.
        - |
          cat > config.js << EOF
          window.APP_CONFIG = {
            cognitoDomain:    '${COGNITO_DOMAIN}',
            clientId:         '${CLIENT_ID}',
            redirectUri:      '${REDIRECT_URI}',
            listEquipmentUrl: '${LIST_EQUIPMENT_URL}',
            reserveUrl:       '${RESERVE_URL}'
          };
          EOF
  artifacts:
    baseDirectory: .
    files:
      - '**/*'
  cache:
    paths: []
    